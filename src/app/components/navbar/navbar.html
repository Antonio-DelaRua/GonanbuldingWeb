<!-- Barra superior: Logo + Contacto -->
<div class="navbar-top">
  <div class="container">
    <div class="navbar-top-row">
      <!-- Logo -->
      <div class="navbar-logo">
        <!--  foto navbar izquierda logo-->
        <img src="assets/img/Imagen4 (2).png" alt="Gonan Building Logo" height="50">
        
        <!--  foto navbar izquierda letras-->
        <img src="assets/img/navba1.png" alt="Gonan Building Logo" height="50">
        
      </div>
      <!-- Contacto -->
      <div class="navbar-contact">
        <div>
          <span class="contact-title">teléfono</span>
          <span class="contact-value"><strong>(+34) tu-telefono-aqui</strong></span>
        </div>
        <div>
          <span class="contact-title">Email</span>
          <span class="contact-value"><strong>tu-email-aqui</strong></span>
        </div>
        <div>
          <span class="contact-title">Whatsapp</span>
          <span class="contact-value"><strong>tu-wasap-aqui</strong></span>

      </div>
      <div class="navbar-cta">
        <a class="btn btn-custom" routerLink="/contact">

        </a>
      </div>

</div>

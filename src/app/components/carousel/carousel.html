<div class="carousel">
  <div class="carousel-slide" 
       *ngFor="let slide of slides; let i = index"
       [class.active]="i === current"
       [style.backgroundImage]="
         'linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)), url(' + slide.img + ')'
       ">
    <div class="carousel-content">
      <span class="carousel-badge">{{slide.badge}}</span>
      <h4 class="carousel-subtitle">{{slide.subtitle}}</h4>
      <h1 class="carousel-title">{{slide.title}} <span class="highlight">{{slide.titleHighlight}}</span></h1>
      <a class="btn-carousel" [routerLink]="slide.btnLink">{{slide.btnText}}</a>
    </div>
  </div>
  <div class="carousel-dots">
    <span 
      *ngFor="let slide of slides; let i = index"
      class="dot"
      [class.active]="i === current"
      (click)="goToSlide(i)">
    </span>
  </div>
</div>
